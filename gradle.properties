# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties
# check these on https://modmuss50.me/fabric.html
# Minecraft version to compile against.
# Building against the LOWEST supported version maximises cross-version
# compatibility, since any API present in 26.1 is also present in 26.2 / 26.3.
minecraft_version=26.1
loader_version=0.19.5
# Mod Properties
mod_version=1.0.2
maven_group=com.recipe
archives_base_name=get-recipes
